<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="A beautifully designed 4D To-Do List app with glassmorphism, 3D transforms, and smooth animations. Stay organized in style." />
  <meta name="theme-color" content="#0a0a1a" />
  <title>TaskFlow — Premium To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Animated background -->
  <div class="bg-scene" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-floor"></div>
  </div>

  <main class="container" id="main-container">

    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <div class="logo-icon" id="logo-icon" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36">
                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="32" height="32" rx="8" fill="url(#logoGrad)" opacity="0.15"/>
            <path d="M12 18l4 4 8-8" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 id="app-heading">TaskFlow</h1>
          <p class="tagline">Organize. Focus. Achieve.</p>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat-pill" id="stat-total" title="Total tasks">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
          <span id="stat-total-num">0</span>
        </div>
        <div class="stat-pill stat-done" id="stat-done" title="Completed tasks">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
          <span id="stat-done-num">0</span>
        </div>
      </div>
    </header>

    <!-- Progress bar -->
    <div class="progress-track" id="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-fill" id="progress-fill"></div>
      <span class="progress-label" id="progress-label">0%</span>
    </div>

    <!-- Main card -->
    <section class="todo-card" aria-labelledby="app-heading">

      <!-- Input -->
      <form id="todo-form" autocomplete="off" class="input-row">
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          <input id="todo-input" type="text" placeholder="What needs to be done?" aria-label="New todo" />
        </div>
        <button id="add-btn" type="submit" aria-label="Add task">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add</span>
        </button>
      </form>

      <!-- Filters -->
      <div class="controls">
        <div class="filters" role="tablist" aria-label="Filter todos">
          <button class="filter-btn active" data-filter="all" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            All
          </button>
          <button class="filter-btn" data-filter="active" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
            Active
          </button>
          <button class="filter-btn" data-filter="completed" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
            Done
          </button>
        </div>
        <button id="clear-completed" type="button" class="clear-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          Clear done
        </button>
      </div>

      <!-- Task list -->
      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <!-- Footer count -->
      <footer class="count-bar" id="count"></footer>

    </section>

    <!-- Keyboard hint -->
    <p class="kbd-hint">
      <kbd>Enter</kbd> to add &nbsp;·&nbsp; <kbd>Double-click</kbd> to edit &nbsp;·&nbsp; <kbd>Esc</kbd> to cancel
    </p>

  </main>

  <script src="app.js"></script>
</body>
</html>
